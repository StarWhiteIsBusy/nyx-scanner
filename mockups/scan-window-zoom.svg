<svg xmlns="http://www.w3.org/2000/svg" width="560" height="460" viewBox="0 0 560 460" font-family="'Noto Sans SC','Noto Sans CJK SC','Segoe UI',sans-serif">
  <defs>
    <filter id="popupShadow" x="-10%" y="-30%" width="120%" height="170%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#000000" flood-opacity="0.55"/>
    </filter>
  </defs>
  <rect x="0" y="0" width="560" height="460" rx="14" fill="#231C16" stroke="#181310" stroke-width="1"/>

  <!-- header -->
  <text x="16" y="33" font-size="16" font-weight="bold" fill="#FAB571">扫描二维码</text>
  <g transform="translate(126,14)">
    <rect x="0" y="0" width="28" height="28" rx="8" fill="#3a3128" stroke="#4F4238" stroke-width="1"/>
    <g transform="translate(6,6)" fill="none" stroke="#E8DCD4" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M3 4 L7.5 4 L10 6.5 H16 A1.5 1.5 0 0 1 17.5 8 V15 A1.5 1.5 0 0 1 16 16.5 H4 A1.5 1.5 0 0 1 2.5 15 V5.5 A1.5 1.5 0 0 1 4 4 Z" fill="rgba(232,220,212,0.12)"/>
    </g>
  </g>
  <text x="168" y="32" font-size="11" fill="#928374">将二维码对准摄像头</text>
  <g transform="translate(522,14)">
    <rect x="0" y="0" width="28" height="28" rx="8" fill="#3a3128"/>
    <path d="M9.5 9.5 L18.5 18.5 M18.5 9.5 L9.5 18.5" stroke="#928374" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- zoomed QR fills viewport (white canvas, QR centered, 90% fit) -->
  <rect x="6" y="44" width="548" height="390" rx="10" fill="#FFFFFF" stroke="#FAB571" stroke-width="2"/>
  <image x="114" y="76" width="332" height="332" preserveAspectRatio="xMidYMid meet" href="data:image/png;base64,"/>

  <!-- confirm popup overlaying bottom edge of viewport -->
  <g transform="translate(16,368)" filter="url(#popupShadow)">
    <rect x="0" y="0" width="528" height="56" rx="12" fill="#433A35" opacity="0.92" stroke="#4F4238" stroke-width="1"/>
    <g transform="translate(14,14)">
      <rect x="0" y="0" width="28" height="28" rx="7" fill="#372c1e"/>
      <g fill="none" stroke="#FAB571" stroke-width="1.8" stroke-linecap="round">
        <path d="M5 12 a6 6 0 0 1 12 0 h0 a1.8 1.8 0 0 1 1.8 1.8 v4 a1.8 1.8 0 0 1 -1.8 1.8 h-12 a1.8 1.8 0 0 1 -1.8 -1.8 v-4 a1.8 1.8 0 0 1 1.8 -1.8 Z"/>
        <path d="M11 13.5 v2.5" stroke-width="2"/>
      </g>
    </g>
    <text x="54" y="25" font-size="13.5" font-weight="bold" fill="#E8DCD4">HomeWiFi</text>
    <text x="188" y="24" font-size="11.5" fill="#928374">密码</text>
    <text x="216" y="24" font-size="11.5" fill="#E8DCD4">12345678</text>
    <g transform="translate(452,13)">
      <rect x="0" y="0" width="62" height="30" rx="9" fill="#FAB571"/>
      <text x="31" y="20" font-size="12" font-weight="bold" fill="#231C16" text-anchor="middle">确认连接</text>
    </g>
  </g>
</svg>