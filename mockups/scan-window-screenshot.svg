<svg xmlns="http://www.w3.org/2000/svg" width="560" height="460" viewBox="0 0 560 460" font-family="'Noto Sans SC','Noto Sans CJK SC','Segoe UI',sans-serif">
  <defs>
    <radialGradient id="cam" cx="50%" cy="42%" r="75%">
      <stop offset="0%" stop-color="#2c2118"/>
      <stop offset="100%" stop-color="#19120d"/>
    </radialGradient>
  </defs>
  <rect x="0" y="0" width="560" height="460" rx="14" fill="#231C16" stroke="#181310" stroke-width="1"/>

  <!-- header -->
  <text x="16" y="33" font-size="16" font-weight="bold" fill="#FAB571">扫描二维码</text>

  <!-- folder button (right of title, 28x28 ghost) -->
  <g transform="translate(126,14)">
    <rect x="0" y="0" width="28" height="28" rx="8" fill="#3a3128"/>
    <g transform="translate(6,6)" fill="none" stroke="#E8DCD4" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M3 4 L7.5 4 L10 6.5 H16 A1.5 1.5 0 0 1 17.5 8 V15 A1.5 1.5 0 0 1 16 16.5 H4 A1.5 1.5 0 0 1 2.5 15 V5.5 A1.5 1.5 0 0 1 4 4 Z" fill="rgba(232,220,212,0.12)"/>
    </g>
  </g>

  <!-- screenshot button (right of folder button, 28x28 ghost) -->
  <g transform="translate(162,14)">
    <rect x="0" y="0" width="28" height="28" rx="8" fill="#3a3128"/>
    <g transform="translate(5,5)" fill="none" stroke="#E8DCD4" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <rect x="1" y="3.5" width="20" height="14" rx="2.5"/>
      <path d="M5.5 3.5 L7 1.5 h10 L17.5 3.5"/>
      <circle cx="12" cy="10.5" r="4.5"/>
    </g>
  </g>

  <text x="376" y="32" font-size="11" fill="#928374">将二维码对准摄像头</text>

  <!-- close button -->
  <g transform="translate(522,14)">
    <rect x="0" y="0" width="28" height="28" rx="8" fill="#3a3128"/>
    <path d="M9.5 9.5 L18.5 18.5 M18.5 9.5 L9.5 18.5" stroke="#928374" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- camera viewport 548x390 -->
  <rect x="6" y="44" width="548" height="390" rx="10" fill="url(#cam)" stroke="#FAB571" stroke-width="2"/>
  <!-- focus frame -->
  <g stroke="rgba(250,181,113,0.45)" stroke-width="1" fill="none">
    <path d="M258 176 h24 M282 176 v24 M258 302 h24 M258 278 v-24 M282 302 v-24"/>
    <path d="M278 302 h-20 M258 282 v-20"/>
  </g>
  <circle cx="280" cy="239" r="4" fill="rgba(250,181,113,0.55)"/>
  <!-- OSD -->
  <text x="18" y="418" font-size="10" fill="rgba(146,131,116,0.7)">1280x720 • 15fps</text>
  <text x="504" y="418" font-size="10" fill="rgba(146,131,116,0.7)">● REC</text>
</svg>
